
<div class="padded"></div>
<div class="container">
    <div class="row">

        <div class="col-md-12">
            <div class="card" *ngIf="item">
                <div class="card-header">
                    <my-backbutton class="float-right" [link]="backto"></my-backbutton>
                    <h3><span>{{id==='add'?"Create":"Update"}} </span>Order</h3>
                </div>
                <div class="card-body">

                    <form>
                        <div class="form-group row">
                            <label class="col-md-4 col-form-label">Order Number</label>
                            <div class="col-md-8">
                                {{item.ID}}
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-4 col-form-label">Created On</label>
                            <div class="col-md-8">
                                {{item.createdOn | amDateFormat : 'MM/DD/YYYY'}}
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-4 col-form-label">Customer Name</label>
                            <div class="col-md-8">
                                {{item.Customer.LastName}}
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-4 col-form-label">Admin ?</label>
                            <div class="col-md-8">
                                <input type="checkbox"  name="IsAdmin" [(ngModel)]="item.IsAdmin" required>
                            </div>
                        </div>

                        <div class="form-group row">
                            <div class="offset-sm-4 col-sm-8">
                                <div class="btn-group" role="group">
                                    <button type="button" class="btn btn-success" (click)="add()" *ngIf="id==='add'">Create Order</button>
                                    <button type="button" class="btn btn-success" (click)="save()" *ngIf="id!='add'">Update Order</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
