
<div class="padded"></div>
<div class="container">
    <div class="row">

        <div class="col-md-12">
            <div class="card" *ngIf="item">
                <div class="card-header">
                    <my-backbutton class="float-right" [link]="['/admin/packages']"></my-backbutton>
                    <h3><span>{{id==='add'?"Create":"Update"}} </span>Package</h3>
                </div>
                <div class="card-body">

                    <form>
                        <div class="form-group row">
                            <label class="col-md-4 col-form-label">First Name</label>
                            <div class="col-md-8">
                                <input class="form-control" name="first" placeholder="" [(ngModel)]="item.FirstName" required>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-4 col-form-label">Last Name</label>
                            <div class="col-md-8">
                                <input class="form-control" name="last" placeholder="" [(ngModel)]="item.LastName" required>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-4 col-form-label">Email</label>
                            <div class="col-md-8">
                                <input class="form-control" name="Email" placeholder="" [(ngModel)]="item.Email" required>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-4 col-form-label">Phone</label>
                            <div class="col-md-8">
                                <input class="form-control" name="Phone" placeholder="" [(ngModel)]="item.Phone" required>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-4 col-form-label">Address</label>
                            <div class="col-md-8">
                                <input class="form-control" name="Address" placeholder="" [(ngModel)]="item.Address" required>
                            </div>
                        </div>

                        <div class="form-group row">
                            <div class="offset-sm-4 col-sm-8">
                                <div class="btn-group" role="group">
                                    <button type="button" class="btn btn-success" (click)="add()" *ngIf="id==='add'">Create Package</button>
                                    <button type="button" class="btn btn-success" (click)="save()" *ngIf="id!='add'">Update Package</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
