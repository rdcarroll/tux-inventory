
<div class="padded"></div>
<div class="container">
    <div class="row">

        <div class="col-md-12">
            <div class="card" *ngIf="item">
                <div class="card-header">
                    <my-backbutton class="float-right" [link]="['/admin/administrators']"></my-backbutton>
                    <h3><span>{{id==='add'?"Create":"Update"}} </span>Administrator</h3>
                </div>
                <div class="card-body">

                    <form>
                        <div class="form-group row">
                            <label class="col-md-4 col-form-label">Full Name</label>
                            <div class="col-md-8">
                                <input class="form-control" name="name" placeholder="" [(ngModel)]="item.FULL_NAME" required>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-4 col-form-label">User ID</label>
                            <div class="col-md-8">
                                <input class="form-control" name="userid" placeholder="" [(ngModel)]="item.USER_ID" required>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-md-4 col-form-label">Badge</label>
                            <div class="col-md-8">
                                <input class="form-control" name="badge" placeholder="" [(ngModel)]="item.EMPLOYEE_ID" required>
                            </div>
                        </div>

                        <div class="form-group row">
                            <div class="offset-sm-4 col-sm-8">
                                <div class="btn-group" role="group">
                                    <button type="button" class="btn btn-success" (click)="add()" *ngIf="id==='add'">Create Administrator</button>
                                    <button type="button" class="btn btn-success" (click)="save()" *ngIf="id!='add'">Update Administrator</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
