
<div class="padded"></div>
<div class="container">
    <div class="row">

        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <h3>Inventory Items Currently Out with Customers</h3>
                </div>
                <div class="card-body">
                    <table class="table table-bordered">
                        <tr *ngFor="let item of items">
                            <td>{{item.Inventory.InventoryType.Name}}</td>
                            <td>{{item.Inventory.Description}}</td>
                            <td>{{item.Size}}</td>
                            <td>{{item.Barcode}}</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
