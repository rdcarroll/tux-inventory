
<nav class="navbar navbar-expand-lg navbar-dark ettp-primary ettp-seperate fixed-top hide-on-print" id="mainmenu" *ngIf="canUse">
    <div class="container">
        <button class="navbar-toggler" type="button" (click)="isCollapsed = !isCollapsed" data-toggle="collapse" data-target="#navbarTogglerMain" aria-controls="navbarTogglerMain" [attr.aria-expanded]="!isCollapsed" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarTogglerMain" [ngbCollapse]="isCollapsed">

            <!--<a class="navbar-brand"  routerLink="/landing">PCS</a>-->

            <ul class="navbar-nav mr-auto" *ngIf="canUse">
                <li class="nav-item" *ngFor="let nav of navs | myfilter : {condition:true}" [ngClass]="{'dropdown': nav.childnavs.length>0}" ngbDropdown (openChange)="menuclicked($event);">

                    <a *ngIf="nav.link!=null" class="nav-link" routerLink="{{nav.link}}" routerLinkActive="active" style="font-size: 0.9em;"><fa-icon *ngIf="nav.icon!=null" [icon]="nav.icon.split(' ')"></fa-icon> {{nav.display}}</a>


                    <button *ngIf="nav.link==null" class="nav-link btn btn-link dropdown-toggle" id="navbarDropdownMenuLink" (click)="false;" style="font-size: 0.9em;" ngbDropdownToggle>
                        <fa-icon *ngIf="nav.icon!=null" [icon]="nav.icon.split(' ')"></fa-icon> {{nav.display}}
                    </button>
                    <ul *ngIf="nav.link==null" class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink" ngbDropdownMenu>
                        <li *ngFor="let snav of nav.childnavs | myfilter : {condition:true}">
                            <div *ngIf="snav.link=='divider'" class="dropdown-divider"></div>
                            <a *ngIf="snav.link!='divider'" class="dropdown-item" routerLink="{{snav.link}}" routerLinkActive="active"><fa-icon *ngIf="snav.icon!=null" [icon]="snav.icon.split(' ')"></fa-icon> {{snav.display}}</a>
                        </li>
                    </ul>

                </li>
            </ul>
        </div>

    </div>
</nav>

<div style="min-height: 600px;">
    <router-outlet></router-outlet>
</div>
