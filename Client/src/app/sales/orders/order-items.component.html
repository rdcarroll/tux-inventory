
                            
                            <div class="row padded">
                                <div class="col-md-12">
                                    <div class="float-left">
                                        <my-typeahead [myModel]="package_id" (myModelChange)="packageChanged($event)" 
                                        [options]="packages" [valueField]="'ID'" [displayField]="'Name'" [placeholder]="'Set Package'"></my-typeahead>
                                    </div>
                                    <button class="btn btn-primary float-right" (click)="addItemClicked()"><fa-icon [icon]="['fas', 'plus']"></fa-icon> Item</button>
                                </div>
                            </div>
                            <table class="table table-striped table-condensed">
                                <thead>
                                    <tr>
                                        <th>Type</th>
                                        <th>Style</th>
                                        <th>Description</th>
                                        <th>Size</th>
                                        <th>Price</th>
                                        <th>Confirmed?</th>
                                        <th>Overbooked?</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody style="height:400px;">
                                        <tr *ngFor="let item of orderitems">
                                            <ng-container *ngIf="item.$$editing; else not_editing">
                                                <td colspan="7">
                                                    <order-item-edit [item]="item" (itemChange)="save(item,$event)" (closeEdit)="btnClick(item,'close')"></order-item-edit>
                                                </td>
                                            </ng-container>
                                            <ng-template #not_editing>
                                                <td>{{item.InventoryItem.Inventory.InventoryType.Name}}</td>
                                                <td>{{item.InventoryItem.Inventory.ModelName}}</td>
                                                <td>{{item.InventoryItem.Inventory.Description}}</td>
                                                <td>{{item.InventoryItem.Size}}</td>
                                                <td>{{item.Cost | currency}}</td>
                                                <td>
                                                    <fa-icon *ngIf="item.Confirmed" [icon]="['fas', 'check']" class="text-success" size="xs"></fa-icon>
                                                    <!-- <fa-icon *ngIf="!item.Confirmed" [icon]="['fas', 'times']" class="text-danger" size="xs"></fa-icon> -->
                                                </td>
                                                <td>
                                                    <fa-icon *ngIf="item.overbooked" [icon]="['fas', 'check']" class="text-success" size="xs"></fa-icon>
                                                </td>
                                                <td>
                                                    <button class="btn btn-xs" (click)="btnClick(item,'edit');">
                                                        <fa-icon [icon]="['fas', 'edit']" class="text-info" size="xs" title="Edit"></fa-icon>
                                                    </button>
                                                    <button class="btn btn-xs" (click)="btnClick(item,'delete');" >
                                                        <fa-icon [icon]="['fas', 'trash-alt']" class="text-danger" size="xs" title="Delete"></fa-icon>
                                                    </button>
                                                </td>
                                            </ng-template>
                                        </tr>
                                </tbody>
                            </table>
