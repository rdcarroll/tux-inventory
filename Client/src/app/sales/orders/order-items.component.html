
                            <table class="table table-striped table-condensed">
                                <thead>
                                    <tr>
                                        <th>Type</th>
                                        <th>Style</th>
                                        <th>Description</th>
                                        <th>Size</th>
                                        <th>Price</th>
                                        <th>Status</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody style="height:400px;">
                                        <tr *ngFor="let item of orderitems">
                                            <ng-container *ngIf="item.$$editing; else not_editing">
                                                <td colspan="7">
                                                    <button (click)="btnClick(item,'edit')" class="btn btn-default btn-sm">Close</button>
                                                    <order-item-edit [item]="item"></order-item-edit>
                                                </td>
                                            </ng-container>
                                            <ng-template #not_editing>
                                                <td>{{item.InventoryItem.Inventory.InventoryType.Name}}</td>
                                                <td>
                                                    
                                                </td>
                                                <td></td>
                                                <td></td>
                                                <td>{{item.InventoryItem.Price | currency}}</td>
                                                <td></td>
                                                <td>
                                                    <span (click)="btnClick(item,'edit');$event.stopPropagation();" style="cursor:pointer;">
                                                        <fa-icon [icon]="['fas', 'edit']" class="text-info" size="xs" title="Edit"></fa-icon>
                                                    </span>
                                                    <span (click)="btnClick(item,'delete');$event.stopPropagation();" style="cursor:pointer;">
                                                        <fa-icon [icon]="['fas', 'trash-alt']" class="text-danger" size="xs" title="Delete"></fa-icon>
                                                    </span>
                                                </td>
                                            </ng-template>
                                        </tr>
                                </tbody>
                            </table>
