<div class="row">
    <div class="col-md-6">
        <div class="form-group row">
            <label class="col-md-4 col-form-label">Ticket Number</label>
            <div class="col-md-8">
                <span class="form-control-static">{{ticketnumber}}</span>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-md-4 col-form-label">Customer Name</label>
            <div class="col-md-8">
                <span class="form-control-static">{{customername}}</span>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-md-4 col-form-label">Created</label>
            <div class="col-md-8">
                <span class="form-control-static">{{createddate}}</span>
            </div>
        </div>
    </div>
    
    <div class="col-md-6">
        
        <div class="form-group row">
            <label class="col-md-4 col-form-label">Payments</label>
            <div class="col-md-8">
                
            </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-md-12">
        <table class="table table-striped table-bordered table-condensed">
            <thead>
                <tr>
                    <th>Line</th>
                    <th>Transaction</th>
                    <th>Note</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of ticketitems">
                    <td>{{item.line}}</td>
                    <td>{{item.transaction}}</td>
                    <td>{{item.note}}</td>
                    <td>{{item.price}}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<div class="row">
    <div class="col-md-6"></div>
    <div class="col-md-6">
        <div class="form-group row">
            <label class="col-md-4 col-form-label">Sub-Total</label>
            <div class="col-md-8">
                <input matInput class="form-control" name="SubTotal" type="text" readonly
                                [ngModel]="subtotal | currency:'USD':'symbol':'2.2'"/>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-md-4 col-form-label">Tax</label>
            <div class="col-md-8">
                <input matInput class="form-control" name="Tax" type="text" readonly
                                [ngModel]="tax | currency:'USD':'symbol':'2.2'" />
            </div>
        </div>
        <div class="form-group row">
            <label class="col-md-4 col-form-label">Total</label>
            <div class="col-md-8">
                <input matInput class="form-control" name="TTotal" type="text" readonly
                                [ngModel]="total | currency:'USD':'symbol':'2.2'"/>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-md-4 col-form-label">Paid</label>
            <div class="col-md-8">
                <input matInput class="form-control" name="Paid" type="text" readonly
                                [ngModel]="paid | currency:'USD':'symbol':'2.2'" />
            </div>
        </div>
        <div class="form-group row">
            <label class="col-md-4 col-form-label">Balance Due</label>
            <div class="col-md-8">
                <input matInput class="form-control" name="BalanceDue" type="text" readonly
                                [ngModel]="balancedue | currency:'USD':'symbol':'2.2'" />
            </div>
        </div>
    </div>
</div>
