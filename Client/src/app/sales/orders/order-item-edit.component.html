<div class="row">
    <div class="col-md-6">
        <div class="form-group row">
            <label class="col-md-4 col-form-label">Type</label>
            <div class="col-md-8">
                <select class="form-control" [(ngModel)]="item.InventoryItem.Inventory.InventoryType.ID" name="InventoryTypeID" required >
                    <option *ngFor="let i of inventory_types" [value]="i.ID">{{i.Name}}</option>
                 </select>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-md-4 col-form-label">Style</label>
            <div class="col-md-8">
                <my-typeahead [(myModel)]="item.InventoryItem.Inventory.ModelName" [options]="inventory" [valueField]="'ModelName'" [displayField]="'ModelName'"></my-typeahead>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-md-4 col-form-label">Description</label>
            <div class="col-md-8">
                <span class="form-control-static">{{item.InventoryItem.Inventory.Description}}</span>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="form-group row">
            <label class="col-md-4 col-form-label">Price</label>
            <div class="col-md-8">
                <!-- <span class="form-control-static">{{id!='add' ? order.ID : "TBD"}}</span> -->
            </div>
        </div>
        <div class="form-group row">
            <label class="col-md-4 col-form-label">Status</label>
            <div class="col-md-8">
                <select class="form-control" [(ngModel)]="item.InventoryItem.StatusID" name="StatusID" required >
                    <option *ngFor="let i of statuses" [value]="i.ID">{{i.Name}}</option>
                 </select>
            </div>
        </div>
    </div>
</div>
