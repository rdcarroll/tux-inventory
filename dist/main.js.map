
<table class="table table-striped table-sortable table-sm table-bordered table-hover">
    <tbody>
        <tr>
            <th *ngFor="let col of vcolumns">
                <span *ngIf="!col.sortable">
                    {{col.display}}
                </span>
                <span *ngIf="col.sortable" [ngClass]="[selectedClass(col.variable), 'sort']" (click)="changeSorting(col.variable)">
                    <fa-icon [icon]="['fas', 'arrow-up']" class="text-secondary" size="xs" *ngIf="selectedClass(col.variable) == 'sort-true'"></fa-icon>
                    <fa-icon [icon]="['fas', 'arrow-down']" class="text-secondary" size="xs" *ngIf="selectedClass(col.variable) == 'sort-false'"></fa-icon>
                    <span class="text-info">{{col.display}}</span>
                    <!--<fa-icon [icon]="['fas', 'sort']" class="text-secondary" *ngIf="selectedClass(col.variable) == 'no-sort'"></fa-icon>-->
                </span>

                <div class="d-inline-block filter" *ngIf="col.filterable"
                     ngbDropdown #filterDrop="ngbDropdown" [autoClose]="'outside'">
                    <fa-icon [icon]="['fas', 'filter']" class="text-secondary" size="xs" ngbDropdownAnchor
                             (click)="$event.stopPropagation(); filterDrop.toggle();"></fa-icon>
                    <div ngbDropdownMenu aria-labelledby="dropdownManual">
                        <input [(ngModel)]="col.filtervalue" type="text" (blur)="changeFilter(col)" />
                    </div>
                </div>
            </th>
        </tr>
        <tr *ngFor="let row of data; let i=index" (click)="rowClick(row)" [ngClass]="{rowClass:rowClass,'table-primary':row.$$selected}" id="{{row[rowIdentifier]||i}}">
            <td *ngFor="let col of vcolumns" title="{{col.display}}">
                <div [ngSwitch]="col.filter">
                    <span *ngSwitchCase="'text'">{{getCell(row,col)}}</span>
                    <span *ngSwitchCase="'number'">{{getCell(row,col)}}</span>
                    <span *ngSwitchCase="'date'">{{(getCell(row,col)) | date }}</span>
                    <span *ngSwitchCase="'checkbox'"><input [(ngModel)]="row[col.variable]" type="checkbox" (change)="btnClick(row,'checkbox');$event.stopPropagation();" /></span>

                    <span *ngSwitchCase="'boolean'">
                        <fa-icon *ngIf="row[col.variable]" [icon]="['fas', 'check']" class="text-success" size="xs"></fa-icon>
                        <fa-icon *ngIf="!row[col.variable]" [icon]="['fas', 'times']" class="text-danger" size="xs"></fa-icon>
                    </span>
                    <span *ngSwitchCase="'check'">
                        <fa-icon *ngIf="row[col.variable]" [icon]="['fas', 'check']" class="text-primary" size="xs"></fa-icon>
                    </span>
                    <span *ngSwitchCase="'status'">
                        <fa-icon *ngIf="row[col.variable]==-1" [icon]="['fas', 'times']" class="text-danger" size="xs" title="DOES NOT EXIST"></fa-icon><!--na-->
                        <fa-icon *ngIf="row[col.variable]==0" [icon]="['fas', 'check-circle']" class="text-success" size="xs" title="OPEN"></fa-icon><!--OPEN-->
                        <fa-icon *ngIf="row[col.variable]==1" [icon]="['fas', 'clock']" class="text-warning" size="xs" title="EXPIRED"></fa-icon><!--EXPIRED-->
                        <fa-icon *ngIf="row[col.variable]==2" [icon]="['fas', 'clock']" class="text-warning" size="xs" title="EXPIRED(GRACE)"></fa-icon><!--EXPIRED(GRACE)-->
                        <fa-icon *ngIf="row[col.variable]==4" [icon]="['fas', 'lock']" class="text-danger" size="xs" title="LOCKED(TIMED)"></fa-icon><!--LOCKED(TIMED)-->
                        <fa-icon *ngIf="row[col.variable]==8" [icon]="['fas', 'lock']" class="text-danger" size="xs" title="LOCKED"></fa-icon><!--LOCKED-->
                        <fa-icon *ngIf="row[col.variable]==5" [icon]="['fas', 'clock']" class="text-danger" size="xs" title="EXPIRED & LOCKED(TIMED)"></fa-icon><!--EXPIRED & LOCKED(TIMED)-->
                        <fa-icon *ngIf="row[col.variable]==6" [icon]="['fas', 'clock']" class="text-danger" size="xs" title="EXPIRED(GRACE) & LOCKED(TIMED)"></fa-icon><!--EXPIRED(GRACE) & LOCKED(TIMED)-->
                        <fa-icon *ngIf="row[col.variable]==9" [icon]="['fas', 'clock']" class="text-danger" size="xs" title="EXPIRED & LOCKED"></fa-icon><!--EXPIRED & LOCKED-->
                        <fa-icon *ngIf="row[col.variable]==10" [icon]="['fas', 'clock']" class="text-danger" size="xs" title="EXPIRED(GRACE) & LOCKED"></fa-icon><!--EXPIRED(GRACE) & LOCKED-->
                        <fa-icon *ngIf="row[col.variable]==20" [icon]="['fas', 'asterisk']" class="text-success" size="xs" title="EXISTS [Status Unknown]"></fa-icon><!--EXISTS-->
                        <fa-icon *ngIf="row[col.variable]==21" [icon]="['fas', 'check-circle']" class="text-success" size="xs" title="ENABLED"></fa-icon><!--ENABLED-->
                        <fa-icon *ngIf="row[col.variable]==22" [icon]="['fas', 'check-circle']" class="text-warning" size="xs" title="DISABLED"></fa-icon><!--DISABLED-->
                    </span>

                    <div *ngSwitchCase="'button'" (click)="btnClick(row,col.type);$event.stopPropagation();" style="cursor:pointer;" class="btn btn-sm btn-outline-secondary">
                        <span [ngSwitch]="col.type">
                            <fa-icon *ngSwitchCase="'edit'" [icon]="['fas', 'edit']" class="text-info" size="xs" title="Edit"></fa-icon>
                            <fa-icon *ngSwitchCase="'delete'" [icon]="['fas', 'trash-alt']" class="text-danger" size="xs" title="Delete"></fa-icon>
                            <fa-icon *ngSwitchCase="'approve'" [icon]="['fas', 'thumbs-up']" class="text-success" size="xs" title="Approve"></fa-icon>
                            <fa-icon *ngSwitchCase="'deny'" [icon]="['fas', 'thumbs-down']" class="text-danger" size="xs" title="Deny"></fa-icon>
                            <fa-icon *ngSwitchCase="'view'" [icon]="['fas', 'eye']" class="text-primary" size="xs" title="View"></fa-icon>
                        </span>
                    </div>

                    <span *ngSwitchCase="'link'">
                        <button type="button" class="btn btn-link" (click)="btnClick(row,col.type);$event.stopPropagation();">{{getCell(row,col)}}</button>
                    </span>
                </div>
            </td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
        </tr>
    </tfoot>
</table>
<div class="row">
    <div class="col-md-6">
        <ngb-pagination [collectionSize]="collectionSize" [(page)]="page" (pageChange)="changePage()" [pageSize]="pageSize"
                        [boundaryLinks]="true" [maxSize]="maxSize" [ellipses]="false" *ngIf="data && pageSize < collectionSize" size="sm"></ngb-pagination>
    </div>
    <div class="col-md-6">
        <thru-of [page]="page" [pageSize]="pageSize" [collectionSize]="collectionSize" [count]="data.length" *ngIf="data && pageSize < collectionSize"></thru-of>
    </div>
</div>
