
<app-jumbo customTitle="Inventory Management"></app-jumbo>
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-block text-center">
                    {{title}}
                </div>
            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-block text-center">
                    Get Started With 
                    <a routerLink="/sales/events" routerLinkActive="active" style="font-size: 0.9em;"> Events</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-block text-center">
                    Get Started With 
                    <a routerLink="/sales/orders" routerLinkActive="active" style="font-size: 0.9em;"> Orders</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-block text-center">
                    Get Started With 
                    <a routerLink="/sales/customers" routerLinkActive="active" style="font-size: 0.9em;"> Customers</a>
                </div>
            </div>
        </div>
    </div>

</div>
