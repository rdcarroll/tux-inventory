<div class="container h-100 d-flex flex-column" saveQuery>
  <div class="col-md-12">
      <div class="float-start">
        <h4 style="margin: 0px;" class="pull-left">Check Items In or Out</h4>
      </div>
  </div>
  <div class="flex-grow-1" style="overflow-y: auto;">
    <div class="card-blockz">
      <div class="form-group row mb-2">
          <label class="col-md-4 col-form-label">Select Action</label>
          <div class="col-md-6">
              <select class="form-control" [(ngModel)]="status_type" name="status_types" required>
                  <option *ngFor="let i of status_types" [value]="i.ID">{{i.Name}}</option>
               </select>
          </div>
          <div class="col-md-2">
          </div>
      </div>
      <div class="form-group row mb-2">
          <label class="col-md-4 col-form-label">Scan or Type Barcode</label>
          <div class="col-md-6">
            <!-- <input class="form-control" name="Size" placeholder="" [(ngModel)]="barcode" required> -->
            <my-barcode [(barcode)]="barcode" [name]="'Barcode'" [required]="true" name="barcode"></my-barcode>
          </div>
          <div class="col-md-2">
            <button type="button" class="btn btn-success" (click)="save()">Save Action</button>
          </div>
      </div>
      <table class="table table-striped table-condensed">
          <thead>
            <tr>
                <th>Type</th>
                <th>Style</th>
                <th>Description</th>
                <th>Size</th>
                <th>SKU</th>
                <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of inventory_items">
                <td>{{item.Inventory?.InventoryType.Name}}</td>
                <td>{{item.Inventory?.ModelName}}</td>
                <td>{{item.Inventory?.Description}}</td>
                <td>{{item.Size}}</td>
                <td>{{item.Barcode}}</td>
                <td>{{item.Status?.Name}}</td>
            </tr>
          </tbody>
      </table>
    </div>
  </div>
  <div class="mt-1"></div>
</div>
