
<div class="padded"></div>
<div class="container">
    <div class="row">

        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <h3>{{message}}</h3>
                </div>
                <div class="card-body">
                    <div class="form-group row">
                        <label class="col-md-4 col-form-label">Item Status</label>
                        <div class="col-md-8">
                            <select class="form-control" [(ngModel)]="status" (ngModelChange)="changeStatus($event)" name="StatusID" required >
                                <option *ngFor="let i of statuses" [value]="i.ID">{{i.Name}}</option>
                             </select>
                        </div>
                    </div>
                    <table class="table table-bordered">
                        <tr *ngFor="let item of items">
                            <td>{{item.Inventory.InventoryType.Name}}</td>
                            <td>{{item.Inventory.Description}}</td>
                            <td>{{item.Size}}</td>
                            <td>{{item.Barcode}}</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
